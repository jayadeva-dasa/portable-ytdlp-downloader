name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: portable-ytdlp-downloader-linux
          - os: windows-latest
            asset_name: portable-ytdlp-downloader-windows
          - os: macos-latest
            asset_name: portable-ytdlp-downloader-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Fetch yt-dlp binary for this OS
        run: python scripts/fetch_binaries.py --current-os

      - name: Build executable
        run: python scripts/build.py

      - name: Zip dist folder (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          zip -r "../${{ matrix.asset_name }}.zip" PortableVideoDownloader

      - name: Zip dist folder (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/PortableVideoDownloader -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
